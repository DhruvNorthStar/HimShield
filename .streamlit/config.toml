# Streamlit settings for `streamlit run dashboard/app.py` and `dashboard_v2/app.py`, read from the repo root.

[theme]
# Scheme 4, clean white academic theme (17 September 2026).
base = "light"
primaryColor = "#1565c0"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f8"
textColor = "#222222"
font = "sans serif"

[browser]
# Do not send usage statistics to Streamlit.
gatherUsageStats = false

[client]
toolbarMode = "minimal"
